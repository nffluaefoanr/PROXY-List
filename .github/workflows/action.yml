name: PROXY Updater

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Install Python 3
      uses: actions/setup-python@v6
      with:
        python-version: 3.13
    - name: Install dependencies
      run: |
        wget -q -O /tmp/proxy-checker.deb ${{secrets.PRIVATE_CHECKER}}
        sudo dpkg -i /tmp/proxy-checker.deb
    - name: Run checker
      run: proxy-checker
    - name: Commit files
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Updated Proxies" || echo "no changes"
    - name: Push changes
      run: |
        git pull --rebase origin master || true
        git push origin master
