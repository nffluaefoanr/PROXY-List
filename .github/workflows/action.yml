# Legacy updater retired 2026-11-13.
# Kept (disabled) so path-based hooks don't 404; CI (.github/workflows/ci.yml) supersedes it.
# History of the original checker pipeline lives in git under this filename.
name: PROXY Updater (retired)

on:
  workflow_dispatch:
    inputs:
      enable_legacy:
        description: 'Type YES to run the legacy updater'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.inputs.enable_legacy == 'YES' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Python 3
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          wget -q -O /tmp/proxy-checker.deb ${{secrets.PRIVATE_CHECKER}}
          sudo dpkg -i /tmp/proxy-checker.deb
      - name: Run checker
        run: proxy-checker
      - name: Commit files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Updated Proxies" || echo "no changes"
      - name: Push changes
        run: |
          git pull --rebase origin master || true
          git push origin master
