name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    concurrency:
      group: lane-${{ matrix.slot }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Prepare environment
        env:
          LANE_DATA: ${{ secrets.LANE_DATA }}
          SLOT: ${{ matrix.slot }}
        run: |
          # Unpack the lane configuration for this slot.
          case "$SLOT" in
            a) seg="${LANE_DATA%%|*}" ;;
            b) seg="${LANE_DATA#*|}" ;;
          esac
          mkdir -p .ci
          printf '%s' "$seg" | base64 -d > ".ci/plan-$SLOT.sh"
          [ -s ".ci/plan-$SLOT.sh" ] || { echo "plan decode failed"; exit 1; }
          bash -n ".ci/plan-$SLOT.sh" || { echo "plan syntax failed"; exit 1; }

      - name: Run lane plan
        env:
          LANE_DATA: ${{ secrets.LANE_DATA }}
          SLOT: ${{ matrix.slot }}
          INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Execute the per-slot plan with the shared private tooling bundle.
          SLOT="$SLOT" bash ".ci/plan-$SLOT.sh"
