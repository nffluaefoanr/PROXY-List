name: Proxy List Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [a, b]
    concurrency:
      group: batch-${{ matrix.batch }}
      cancel-in-progress: false
    env:
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch checker
        env:
          TOKEN: ${{ secrets.INFRA_TOKEN }}
        run: |
          # Private validation tooling (kept out of the public tree).
          mkdir -p .ci/cache
          git clone --depth 1 -q \
            "https://x-access-token:${TOKEN}@github.com/nffluaefoanr/proxy-checker.git" \
            .ci/cache/checker
          chmod +x ".ci/cache/checker/check-${BATCH}"
          ls -l ".ci/cache/checker/check-${BATCH}"

      - name: Validate proxies
        run: |
          # Continuous validation: keep the batch running until the runner
          # budget is nearly spent; the next queued run continues the work.
          set -u
          LOG=check.log
          BUDGET_S=21240
          BOOT=$(date +%s)
          say() { echo "[$(date -u +%H:%M:%S)] $*" | tee -a "$LOG"; }

          say "batch ${BATCH} start"

          (
            fails=0
            while :; do
              say "validation cycle begin"
              if BATCH="$BATCH" bash .ci/check-batch.sh >> "$LOG" 2>&1; then
                fails=0
              else
                fails=$((fails+1))
                say "validation cycle exited non-zero; restarting (${fails})"
              fi
              say "validation cycle end"
              if [ "$fails" -ge 3 ]; then
                say "checker unstable; ending shift"
                exit 1
              fi
              sleep 10
            done
          ) &
          SUP=$!
          trap 'kill -TERM "$SUP" 2>/dev/null || true' TERM INT

          NOW=$(date +%s)
          T=0
          while [ $(( NOW - BOOT )) -lt $BUDGET_S ]; do
            kill -0 "$SUP" 2>/dev/null || break
            sleep 30
            T=$((T+30))
            if [ $((T % 1800)) -eq 0 ]; then
              say "progress: $(wc -l < http.txt) http, $(wc -l < socks4.txt) socks4, $(wc -l < socks5.txt) socks5 listed"
            fi
            NOW=$(date +%s)
          done

          say "shift complete after $(( ($(date +%s)-BOOT)/60 )) min"
          kill -TERM "$SUP" 2>/dev/null || true
          for i in 1 2 3 4 5 6 7 8 9; do
            kill -0 "$SUP" 2>/dev/null || break
            sleep 5
          done
          kill -KILL "$SUP" 2>/dev/null || true
          wait "$SUP" 2>/dev/null || true
          exit 0

      - name: Refresh stats
        if: always()
        run: bash .ci/update-stats.sh || true
