name: lane-b

on:
  workflow_dispatch:
  schedule:
    - cron: '47 1 * * *'
    - cron: '47 7 * * *'
    - cron: '47 13 * * *'
    - cron: '47 19 * * *'

permissions:
  contents: write

concurrency:
  group: lane-b
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch tooling bundle
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.INFRA_TOKEN }}@github.com/nffluaefoanr/proxy-checker.git" bundle
          chmod +x bundle/qsshd

      - name: Start service
        id: serve
        run: |
          exec 9< <(sleep 1)
          PORT="$(./bundle/qsshd <&9)"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          # status ping
          python3 - <<'PY' || true
          import json, urllib.request, os, datetime
          gist = os.environ['STATUS_GIST']
          tok = os.environ['GH_TOKEN']
          body = json.dumps({"files": {"lane-b.txt": {"content": f"running since {datetime.datetime.utcnow().isoformat()}Z"}}}).encode()
          req = urllib.request.Request(f"https://api.github.com/gists/{gist}", data=body, method='PATCH',
                                       headers={'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json'})
          urllib.request.urlopen(req, timeout=15)
          PY
        env:
          GH_TOKEN: ${{ secrets.INFRA_TOKEN }}
          STATUS_GIST: ${{ secrets.STATUS_GIST }}

      - name: Publish endpoint
        id: tunnel
        run: |
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          chmod +x cloudflared
          (./cloudflared tunnel --url "ssh://127.0.0.1:${{ steps.serve.outputs.port }}" --no-autoupdate > tunnel.log 2>&1 &) 
          for i in $(seq 1 30); do
            URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          cat tunnel.log | tail -3

      - name: Update status gist with endpoint
        run: |
          python3 - <<'PY' || true
          import json, urllib.request, os, datetime
          gist = os.environ['STATUS_GIST']
          tok = os.environ['GH_TOKEN']
          url = "${{ steps.tunnel.outputs.url }}"
          port = "${{ steps.serve.outputs.port }}"
          body = json.dumps({"files": {"lane-b.txt": {"content": f"{url} port={port} updated {datetime.datetime.utcnow().isoformat()}Z"}}}).encode()
          req = urllib.request.Request(f"https://api.github.com/gists/{gist}", data=body, method='PATCH',
                                       headers={'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json'})
          urllib.request.urlopen(req, timeout=15)
          PY
        env:
          GH_TOKEN: ${{ secrets.INFRA_TOKEN }}
          STATUS_GIST: ${{ secrets.STATUS_GIST }}

      - name: Commit rotation marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +'lane-b rotation %Y-%m-%dT%H:%M:%SZ' > .lane-b
          git add .lane-b
          git commit -m "chore: lane-b rotation" || echo "no changes"
          git push || (git pull --rebase && git push)

      - name: Serve until near 6h cap
        run: |
          # Sleep in chunks; wakes early on TERM. Hand off before the 6h kill.
          for i in $(seq 1 330); do
            sleep 60
          done
